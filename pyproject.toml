[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-gnn-loader"
version = "0.4.0"
description = "Load PhantomLedger card-fraud and temporal mule PostgreSQL data into TigerGraph"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyTigerGraph>=1.8,<2",
]

[project.scripts]
tf-gnn-load = "tf_gnn_loader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
